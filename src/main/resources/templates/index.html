<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4CAF50" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepaidApp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .login-container {
        background: white;
        padding: 20px 30px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
        position: relative;
      }
      .login-container h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      .login-container input[type="text"],
      .login-container input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .login-container button {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .login-container button:hover {
        background: #45a049;
      }
      .login-container .extra {
        text-align: center;
        margin-top: 12px;
        font-size: 14px;
      }
      .login-container .extra a {
        color: #4caf50;
        text-decoration: none;
      }

      /* Loading overlay */
      .loading-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(76, 175, 80, 0.9);
        z-index: 2000;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
      }
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 5px solid rgba(255, 255, 255, 0.3);
        border-top: 5px solid white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Smart install popup - more streamlined */
      .smart-install-popup {
        display: none;
        position: fixed;
        bottom: 20px;
        left: 20px;
        right: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        padding: 20px;
        z-index: 1500;
        max-width: 400px;
        margin: 0 auto;
        animation: slideUp 0.3s ease;
      }
      @keyframes slideUp {
        from {
          transform: translateY(100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      .smart-install-popup h3 {
        margin: 0 0 15px 0;
        color: #4caf50;
        text-align: center;
      }
      .smart-install-popup p {
        margin: 0 0 15px 0;
        color: #666;
        font-size: 14px;
        text-align: left;
        line-height: 1.4;
      }
      .install-instructions {
        background: #f8f9fa;
        padding: 12px;
        border-radius: 6px;
        margin: 10px 0;
        font-size: 13px;
        border-left: 3px solid #4caf50;
      }
      .install-instructions strong {
        color: #4caf50;
        display: block;
        margin-bottom: 5px;
      }
      .smart-install-popup .buttons {
        display: flex;
        gap: 10px;
      }
      .smart-install-popup button {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
      }
      .install-btn {
        background: #4caf50;
        color: white;
      }
      .later-btn {
        background: #f0f0f0;
        color: #666;
      }

      /* Auto-redirect message */
      .redirect-message {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        text-align: center;
        z-index: 2001;
        max-width: 300px;
      }
    </style>
  </head>
  <body>
    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-spinner"></div>
      <h3>Setting up your app...</h3>
      <p>Please wait while we prepare everything for you</p>
    </div>

    <!-- Auto-redirect message -->
    <div id="redirectMessage" class="redirect-message">
      <h3>✅ Almost Ready!</h3>
      <p>Redirecting to your app experience...</p>
      <div class="loading-spinner" style="margin: 20px auto"></div>
    </div>

    <div class="login-container">
      <h2>Login</h2>
      <form id="loginForm">
        <input
          type="text"
          name="username"
          placeholder="Username or Email"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />
        <button type="submit">Login</button>
        <div class="extra">
          <p>Don't have an account? <a href="/register">Register</a></p>
        </div>
      </form>
    </div>

    <!-- Smart install popup -->
    <div id="smartInstallPopup" class="smart-install-popup">
      <h3>📱 Install As App for Better Experience</h3>
      <p id="installMessage">Want to know how to install?</p>

      <button
        id="howBtn"
        class="install-btn"
        style="width: 100%; margin-bottom: 10px"
      >
        How?
      </button>

      <div
        id="installInstructions"
        class="install-instructions"
        style="display: none"
      >
        <!-- Instructions will be dynamically filled -->
      </div>

      <div class="buttons">
        <button id="continueWeb" class="later-btn">Continue in Browser</button>
      </div>
    </div>

    <script>
      // Handle "How?" button click
      document.getElementById("howBtn").addEventListener("click", () => {
        document.getElementById("installInstructions").style.display = "block";
        document.getElementById("continueWeb").style.display = "none";
        document.getElementById("howBtn").style.display = "none";
      });

      let deferredPrompt;
      let installAttempted = false;

      // Function to proceed to app
      function proceedToApp() {
        // Hide popup
        document.getElementById("smartInstallPopup").style.display = "none";

        // Submit the form
        document.getElementById("loginForm").submit();
      }

      // PWA install detection
      function isAppInstalled() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true ||
          document.referrer.includes("android-app://") ||
          window.location.search.includes("source=pwa")
        );
      }

      // Device detection
      const userAgent = navigator.userAgent.toLowerCase();
      const isIOS = /iphone|ipad|ipod/.test(userAgent);
      const isAndroid = /android/.test(userAgent);
      const isMobile = isIOS || isAndroid || /mobi/.test(userAgent);
      const isChrome = /chrome/.test(userAgent) && !/edge/.test(userAgent);
      const isSafari = /safari/.test(userAgent) && !/chrome/.test(userAgent);

      // Set form action
      if (isMobile) {
        document.getElementById("loginForm").action = "/meter_management_pwa";
      } else {
        document.getElementById("loginForm").action = "/meter_management";
      }

      // Service worker registration
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((reg) => console.log("SW registered:", reg))
            .catch((err) => console.error("SW failed:", err));
        });
      }

      // Capture install prompt
      window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;
        showInstallOptions();
      });

      // Show install options based on platform
      function showInstallOptions() {
        if (isAppInstalled()) return;

        // Show smart popup immediately on page load
        showSmartInstallPopup();
      }

      function showSmartInstallPopup() {
        const popup = document.getElementById("smartInstallPopup");
        const message = document.getElementById("installMessage");
        const instructions = document.getElementById("installInstructions");

        if (isIOS && isSafari) {
          message.textContent = "To install this app on your iPhone:";
          instructions.innerHTML = `
            1. Tap the Share button (📤) at the bottom<br>
            2. Scroll down and tap "Add to Home Screen"<br>
            3. Tap "Add" to confirm<br>
            4. The app will appear on your home screen
          `;
        } else if (isAndroid && isChrome) {
          message.textContent = "To install this app on your Android:";
          instructions.innerHTML = `
            1. Tap the menu (⋮) in the top-right corner<br>
            2. Select "Add to Home screen" or "Install app"<br>
            3. Tap "Add" or "Install" to confirm<br>
            4. The app will appear on your home screen
          `;
        } else {
          message.textContent = "To install this app on your device:";
          instructions.innerHTML = `
            1. Look for an install icon (⬇️) in your address bar<br>
            2. Click it and select "Install"<br>
            3. Or check your browser menu for "Install" option<br>
            4. The app will be available in your apps menu
          `;
        }

        popup.style.display = "block";
      }

      // Event handlers
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          if (isAppInstalled()) {
            // Already installed - direct submit
            this.submit();
            return;
          }

          // Not installed - show install popup
          if (
            !document.getElementById("smartInstallPopup").style.display ||
            document.getElementById("smartInstallPopup").style.display ===
              "none"
          ) {
            showSmartInstallPopup();
          }
        });

      // Popup button
      document
        .getElementById("continueWeb")
        .addEventListener("click", proceedToApp);

      // Auto-show install popup on page load
      document.addEventListener("DOMContentLoaded", () => {
        if (!isAppInstalled()) {
          // Show popup immediately when page loads
          setTimeout(() => showInstallOptions(), 500);
        }
      });

      // Check for returning PWA user
      if (isAppInstalled()) {
        console.log("Running in installed PWA mode");
        // Could add PWA-specific features here
      }
    </script>
  </body>
</html>
