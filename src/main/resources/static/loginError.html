<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Meter Application - Login Error</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .container {
      text-align: center;
      padding: 3rem;
      border-radius: 15px;
      background: rgba(28, 28, 44, 0.8);
      box-shadow: 0 0 20px rgba(30, 144, 255, 0.3);
      backdrop-filter: blur(5px);
      animation: float 3s ease-in-out infinite;
      width: 400px;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #ff4d4d;
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    p {
      font-size: 1.2rem;
      color: #a0c4ff;
      margin-bottom: 2rem;
    }
    button {
      color: #1e90ff;
      text-decoration: none;
      font-size: 1.2rem;
      padding: 0.8rem 1.5rem;
      border: 2px solid #1e90ff;
      border-radius: 25px;
      background: none;
      transition: all 0.3s ease;
      cursor: pointer;
      display: inline-block;
    }
    button:hover {
      background: #1e90ff;
      color: #fff;
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(30, 144, 255, 0.4);
    }
    .background-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(30, 144, 255, 0.1) 0%, rgba(0, 0, 0, 0.8) 70%);
      z-index: -1;
      animation: glow 10s infinite alternate;
    }
    @keyframes glow {
      0% { opacity: 0.5; }
      100% { opacity: 0.8; }
    }
    .footer {
      position: absolute;
      bottom: 1rem;
      font-size: 0.9rem;
      color: #b0b0b0;
    }
  </style>
</head>
<body>
<div class="background-glow"></div>
<div class="container">
  <h1>Login Failed</h1>
  <p>Invalid username or password. Please try again.</p>
  <button onclick="window.location.href='index.html'">Back to Login</button>
</div>
<div class="footer">
  © 2025 Electric Meter Solutions. All rights reserved.
</div>
</body>
</html>
