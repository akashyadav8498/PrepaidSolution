<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e3192" />
    <meta
      name="description"
      content="Tenant login for prepaid PG energy management." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AR IoT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <title>AR IoT Solutions - Tenant Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .install-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 1000;
        background: linear-gradient(135deg, #2e3192, #f37021);
        color: #fff;
        border-radius: 16px;
        box-shadow: 0 16px 36px rgba(30, 41, 59, 0.24);
        padding: 16px;
        display: none;
      }
      .install-banner.show {
        display: block;
      }
      .install-banner-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .install-banner-text {
        font-size: 0.8rem;
        line-height: 1.4;
        opacity: 0.95;
      }
      .install-banner-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .install-banner-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }
      .install-banner-btn.primary {
        background: #fff;
        color: #2e3192;
      }
      .install-banner-btn.secondary {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
      .login-card {
        min-height: 370px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        width: 100%;
        max-width: 100%;
        overflow: hidden;
      }
      #loginForm {
        width: 100%;
        max-width: 100%;
        min-width: 0;
      }
      .login-card .login-logo {
        display: block;
        margin: 0 auto 30px;
      }
      .otp-message-slot {
        min-height: 44px;
        display: block;
        width: 100%;
      }
      #otpMessage {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="login-screen">
        <!-- <img
          src="C:\Users\sw\Downloads\ariot_logo.jpeg"
          alt="Logo"
          class="login-logo" /> -->
        <form id="loginForm">
          <div class="login-card">
            <!-- <h3 style="margin-bottom: 20px; color: var(--secondary)">
            Welcome to Pay As You Go
          </h3> -->
            <img src="/images/ariot_logo.jpeg" alt="Logo" class="login-logo" />
            <div class="input-group">
              <label>Email</label>
              <input
                type="email"
                id="email"
                placeholder="Enter your email"
                oninput="handleEmailTyping()"
                required />
            </div>
            <div class="input-group">
              <label>Verify OTP</label>
              <div class="otp-row">
                <input
                  id="otp"
                  type="text"
                  inputmode="numeric"
                  maxlength="6"
                  placeholder="XXXXXX"
                  style="width: 90px; text-align: center" />

                <button
                  id="sendOtpBtn"
                  type="button"
                  class="btn-send"
                  onclick="handleSendOtp()">
                  Send OTP
                </button>
              </div>
            </div>
            <button
              id="verifyOtpBtn"
              type="button"
              class="btn-primary"
              onclick="verifyOTP()"
              style="background: var(--primary)">
              VERIFY & LOGIN
            </button>
            <div class="otp-message-slot">
              <div
                id="otpMessage"
                style="
                  font-size: 0.8rem;
                  margin-top: 12px;
                  min-height: 32px;
                  color: var(--muted);
                "></div>
            </div>
          </div>
          <div style="margin-top: 20px; text-align: center; pt: 15px">
            <p style="font-size: 0.85rem; color: var(--muted)">
              Are you an administrator?
              <a
                href="/admin_index.html"
                style="
                  color: #2e3192;
                  font-weight: 700;
                  text-decoration: none;
                  margin-left: 5px;
                ">
                Login to Admin Panel
              </a>
            </p>
          </div>
        </form>
      </div>
    </div>
    <div id="installBanner" class="install-banner" aria-live="polite">
      <div class="install-banner-title">Install Tenant App</div>
      <div class="install-banner-text">
        Add this app to your home screen for a faster, full-screen experience.
      </div>
      <div class="install-banner-actions">
        <button
          type="button"
          class="install-banner-btn primary"
          onclick="installApp()">
          Install
        </button>
        <button
          type="button"
          class="install-banner-btn secondary"
          onclick="dismissInstallBanner()">
          Maybe later
        </button>
      </div>
    </div>
    <script>
      let deferredPrompt = null;
      let installBannerDismissed =
        localStorage.getItem("installBannerDismissed") === "true";
      function isStandaloneMode() {
        return (
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true
        );
      }
      function isAppInstalled() {
        return (
          localStorage.getItem("pwaInstalled") === "true" || isStandaloneMode()
        );
      }
      function markAppInstalled(installed) {
        localStorage.setItem("pwaInstalled", installed ? "true" : "false");
      }
      function showInstallBanner() {
        const banner = document.getElementById("installBanner");
        if (!banner || installBannerDismissed || isAppInstalled()) {
          return;
        }
        banner.classList.add("show");
      }
      function hideInstallBanner() {
        const banner = document.getElementById("installBanner");
        if (banner) {
          banner.classList.remove("show");
        }
      }
      function dismissInstallBanner() {
        installBannerDismissed = true;
        localStorage.setItem("installBannerDismissed", "true");
        hideInstallBanner();
      }
      async function installApp() {
        if (!deferredPrompt) {
          hideInstallBanner();
          if (!isAppInstalled()) {
            window.alert(
              "Install is not available in this browser yet. In Chrome or Edge, use the browser menu and choose Install App.",
            );
          }
          return;
        }
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        if (choice.outcome === "accepted") {
          markAppInstalled(true);
          hideInstallBanner();
        } else {
          markAppInstalled(false);
          showInstallBanner();
        }
        deferredPrompt = null;
      }
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
        markAppInstalled(false);
        localStorage.removeItem("installBannerDismissed");
        installBannerDismissed = false;
        showInstallBanner();
      });
      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        markAppInstalled(true);
        localStorage.removeItem("installBannerDismissed");
        installBannerDismissed = false;
        hideInstallBanner();
      });
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          if (isStandaloneMode()) {
            markAppInstalled(true);
            hideInstallBanner();
          }
          navigator.serviceWorker
            .register("/service-worker.js")
            .catch((error) =>
              console.error("Service worker registration failed", error),
            );
          setTimeout(() => {
            if (
              !deferredPrompt &&
              !installBannerDismissed &&
              !isAppInstalled()
            ) {
              showInstallBanner();
            }
          }, 1500);
        });
      }

      const otpMessage = document.getElementById("otpMessage");
      const sendOtpBtn = document.getElementById("sendOtpBtn");
      const otpInput = document.getElementById("otp");
      const emailInput = document.getElementById("email");
      const verifyOtpBtn = document.getElementById("verifyOtpBtn");
      let resendPromptTimeout = null;
      let lastEmailValue = emailInput.value.trim().toLowerCase();
      let otpPromptState = {
        sendCount: 0,
        maxAttempts: 2,
        resendPromptDelaySeconds: 30,
      };

      function setOtpMessage(message, isError = false) {
        otpMessage.textContent = message;
        otpMessage.style.color = isError ? "#dc2626" : "var(--muted)";
      }

      function resetResendPrompt(clearMessage = false) {
        if (resendPromptTimeout) {
          clearTimeout(resendPromptTimeout);
          resendPromptTimeout = null;
        }
        if (clearMessage) {
          otpMessage.innerHTML = "";
          otpMessage.style.color = "var(--muted)";
        }
      }

      function showMessageWithAction(message, buttonLabel, onClickHandlerName) {
        otpMessage.innerHTML = "";
        otpMessage.style.color = "var(--muted)";

        const textSpan = document.createElement("span");
        textSpan.textContent = message + " ";

        const actionButton = document.createElement("button");
        actionButton.type = "button";
        actionButton.className = "btn-send";
        actionButton.textContent = buttonLabel;
        actionButton.setAttribute("onclick", onClickHandlerName);

        otpMessage.appendChild(textSpan);
        otpMessage.appendChild(actionButton);
      }

      function resetOtpFlowState(clearMessage = true) {
        resetResendPrompt(clearMessage);
        otpPromptState = {
          sendCount: 0,
          maxAttempts: 2,
          resendPromptDelaySeconds: 30,
        };
        sendOtpBtn.style.display = "inline-block";
        sendOtpBtn.disabled = false;
        verifyOtpBtn.disabled = false;
        otpInput.value = "";
        if (clearMessage) {
          setOtpMessage("");
        }
      }

      function hasActiveOtpUiState() {
        return (
          otpInput.value.trim() !== "" ||
          otpMessage.textContent.trim() !== "" ||
          sendOtpBtn.disabled ||
          sendOtpBtn.style.display === "none" ||
          verifyOtpBtn.disabled
        );
      }

      function handleEmailTyping() {
        const typedEmail = emailInput.value.trim().toLowerCase();
        const previousEmail = lastEmailValue;
        lastEmailValue = typedEmail;

        if (!hasActiveOtpUiState()) {
          return;
        }

        if (typedEmail !== previousEmail) {
          resetOtpFlowState();
        }
      }

      function scheduleResendPrompt() {
        resetResendPrompt();

        resendPromptTimeout = setTimeout(() => {
          if (otpInput.value.trim()) {
            return;
          }

          if (otpPromptState.sendCount < otpPromptState.maxAttempts) {
            showMessageWithAction(
              "Did not receive an OTP?",
              "Send again",
              "handleSendOtp(true)",
            );
            return;
          }

          setOtpMessage("Something is wrong. Try again later.", true);
        }, otpPromptState.resendPromptDelaySeconds * 1000);
      }

      async function handleSendOtp(isResend = false) {
        const email = emailInput.value.trim();
        const normalizedEmail = email.toLowerCase();

        if (!email) {
          setOtpMessage("Enter your email first.", true);
          return;
        }

        const actionButton = sendOtpBtn;
        actionButton.disabled = true;
        lastEmailValue = normalizedEmail;
        setOtpMessage(isResend ? "Sending OTP again..." : "Sending OTP...");
        resetResendPrompt();

        try {
          const response = await fetch("/sendOTP", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email }),
          });

          const data = await response.json();

          if (!response.ok) {
            if (response.status === 429) {
              otpPromptState = {
                sendCount: Number(data.sendCount || otpPromptState.sendCount),
                maxAttempts: Number(data.maxAttempts || otpPromptState.maxAttempts),
                resendPromptDelaySeconds: Number(
                  data.resendPromptDelaySeconds || otpPromptState.resendPromptDelaySeconds,
                ),
              };
            }
            setOtpMessage(data.message || "Unable to send OTP.", true);
            actionButton.disabled = false;
            return;
          }

          otpPromptState = {
            sendCount: Number(data.sendCount || 1),
            maxAttempts: Number(data.maxAttempts || 2),
            resendPromptDelaySeconds: Number(data.resendPromptDelaySeconds || 30),
          };

          setOtpMessage(
            otpPromptState.sendCount === 1
              ? "An OTP has been sent to your email. Please check it and enter it here."
              : "A new OTP has been sent to your email. Please check it and enter it here.",
          );

          lastEmailValue = normalizedEmail;
          sendOtpBtn.style.display = "none";
          scheduleResendPrompt();
          otpInput.focus();
        } catch (error) {
          setOtpMessage(
            "Unable to send OTP right now. Please try again.",
            true,
          );
          actionButton.disabled = false;
        }
      }

      otpInput.addEventListener("input", () => {
        if (otpInput.value.trim()) {
          resetResendPrompt();
        }
      });

      async function verifyOTP() {
        const email = emailInput.value.trim();
        const otp = otpInput.value.trim();
        const verifyButton = verifyOtpBtn;
        lastEmailValue = email.toLowerCase();

        if (!email || !otp) {
          setOtpMessage("Enter both email and OTP.", true);
          return;
        }

        verifyButton.disabled = true;
        setOtpMessage("Verifying OTP...");

        try {
          const res = await fetch("/verifyOTP", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, otp }),
          });

          const data = await res.json();

          if (res.ok) {
            resetResendPrompt(false);
            setOtpMessage(data.message);
            window.location.href = data.redirectUrl || "/tenant";
            return;
          }

          setOtpMessage(data.message, true);
        } catch (error) {
          setOtpMessage(
            "Unable to verify OTP right now. Please try again.",
            true,
          );
        } finally {
          verifyButton.disabled = false;
        }
      }
    </script>
  </body>
</html>
