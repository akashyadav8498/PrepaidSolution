<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2e3192" />
    <meta name="description" content="Tenant login for prepaid PG energy management." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AR IoT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/images/icon-192.png" />
    <title>AR IoT Solutions - Tenant Login</title>
    <link rel="stylesheet" href="css/styles.css" />
    <style>
      .install-banner {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 1000;
        background: linear-gradient(135deg, #2e3192, #f37021);
        color: #fff;
        border-radius: 16px;
        box-shadow: 0 16px 36px rgba(30, 41, 59, 0.24);
        padding: 16px;
        display: none;
      }
      .install-banner.show {
        display: block;
      }
      .install-banner-title {
        font-size: 0.95rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .install-banner-text {
        font-size: 0.8rem;
        line-height: 1.4;
        opacity: 0.95;
      }
      .install-banner-actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }
      .install-banner-btn {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 0.8rem;
        font-weight: 700;
        cursor: pointer;
      }
      .install-banner-btn.primary {
        background: #fff;
        color: #2e3192;
      }
      .install-banner-btn.secondary {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div id="login-screen">
        <!-- <img
          src="C:\Users\sw\Downloads\ariot_logo.jpeg"
          alt="Logo"
          class="login-logo" /> -->
          <form id="loginForm" action="/perform_login" method="post">
        <div class="login-card">
          <!-- <h3 style="margin-bottom: 20px; color: var(--secondary)">
            Welcome to Pay As You Go
          </h3> -->
          <img src="/images/ariot_logo.jpeg" alt="Logo" class="login-logo" />
          <div class="input-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" />
          </div>
          <div class="input-group">
            <label>Verify OTP</label><div class="otp-row">
              <input id="otp" type="number" placeholder="XXXX" style="width: 80px; text-align: center" />

              <button id="sendOtpBtn" type="button" class="btn-send" onclick="handleSendOtp()">
                  Send OTP
              </button>
          </div>
          </div>
            <p id="resendText" style="font-size: 0.7rem; color: var(--muted); margin: 15px 0; display:none;">
                Resend in <span id="timer">30</span>s
            </p>
          <button
            class="btn-primary"
            onclick="verifyOTP()"
            style="background: var(--primary)">
            VERIFY & LOGIN
          </button>
        </div>
              <div style="margin-top: 20px; text-align: center; pt: 15px;">
                  <p style="font-size: 0.85rem; color: var(--muted);">
                      Are you an administrator?
                      <a href="/admin_index.html" style="color: #2e3192; font-weight: 700; text-decoration: none; margin-left: 5px;">
                          Login to Admin Panel
                      </a>
                  </p>
              </div>
          </form>
      </div>
    </div>
    <div id="installBanner" class="install-banner" aria-live="polite">
      <div class="install-banner-title">Install Tenant App</div>
      <div class="install-banner-text">Add this app to your home screen for a faster, full-screen experience.</div>
      <div class="install-banner-actions">
        <button type="button" class="install-banner-btn primary" onclick="installApp()">Install</button>
        <button type="button" class="install-banner-btn secondary" onclick="dismissInstallBanner()">Maybe later</button>
      </div>
    </div>
    <script>
    let deferredPrompt = null;
    let installBannerDismissed = localStorage.getItem("installBannerDismissed") === "true";
    function isStandaloneMode() {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }
    function isAppInstalled() {
      return localStorage.getItem("pwaInstalled") === "true" || isStandaloneMode();
    }
    function markAppInstalled(installed) {
      localStorage.setItem("pwaInstalled", installed ? "true" : "false");
    }
    function showInstallBanner() {
      const banner = document.getElementById("installBanner");
      if (!banner || installBannerDismissed || isAppInstalled()) {
        return;
      }
      banner.classList.add("show");
    }
    function hideInstallBanner() {
      const banner = document.getElementById("installBanner");
      if (banner) {
        banner.classList.remove("show");
      }
    }
    function dismissInstallBanner() {
      installBannerDismissed = true;
      localStorage.setItem("installBannerDismissed", "true");
      hideInstallBanner();
    }
    async function installApp() {
      if (!deferredPrompt) {
        hideInstallBanner();
        if (!isAppInstalled()) {
          window.alert("Install is not available in this browser yet. In Chrome or Edge, use the browser menu and choose Install App.");
        }
        return;
      }
      deferredPrompt.prompt();
      const choice = await deferredPrompt.userChoice;
      if (choice.outcome === "accepted") {
        markAppInstalled(true);
        hideInstallBanner();
      } else {
        markAppInstalled(false);
        showInstallBanner();
      }
      deferredPrompt = null;
    }
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      markAppInstalled(false);
      localStorage.removeItem("installBannerDismissed");
      installBannerDismissed = false;
      showInstallBanner();
    });
    window.addEventListener("appinstalled", () => {
      deferredPrompt = null;
      markAppInstalled(true);
      localStorage.removeItem("installBannerDismissed");
      installBannerDismissed = false;
      hideInstallBanner();
    });
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        if (isStandaloneMode()) {
          markAppInstalled(true);
          hideInstallBanner();
        }
        navigator.serviceWorker
          .register("/service-worker.js")
          .catch((error) => console.error("Service worker registration failed", error));
        setTimeout(() => {
          if (!deferredPrompt && !installBannerDismissed && !isAppInstalled()) {
            showInstallBanner();
          }
        }, 1500);
      });
    }

let countdownInterval = null;
let timeLeft = 30;

async function handleSendOtp() {
    const email = document.getElementById("email").value;

    if (!email) {
        alert("Enter email first");
        return;
    }

    // Call backend
    await fetch("/sendOTP", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email })
    });

    startOtpTimer();
}

function startOtpTimer() {
    const btn = document.getElementById("sendOtpBtn");
    const resendText = document.getElementById("resendText");
    const timer = document.getElementById("timer");

    // Hide button, show timer
    btn.style.display = "none";
    resendText.style.display = "block";

    timeLeft = 30;
    timer.innerText = timeLeft;

    countdownInterval = setInterval(() => {
        timeLeft--;
        timer.innerText = timeLeft;

        if (timeLeft <= 0) {
            clearInterval(countdownInterval);

            // Show button again
            btn.style.display = "inline-block";
            resendText.style.display = "none";
        }
    }, 1000);
}

async function verifyOtp() {
    const email = document.getElementById("email").value;
    const otp = document.getElementById("otp").value;

    const res = await fetch("/verifyOTP", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, otp })
    });

    if (res.ok) {
        clearInterval(countdownInterval); // ✅ stop timer on success
        alert("Login successful");
        window.location.href = "/dashboard";
    } else {
        alert("Invalid OTP");
    }
}

    </script>
</body>
</html>
